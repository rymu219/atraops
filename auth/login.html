<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — AtraOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0f14; --bg-panel: #151c26; --bg-input: #0e141c;
    --border: #2a3544; --text: #e8eef6; --text-muted: #8b9bb0;
    --primary: #3b9eff; --primary-hover: #5cb0ff; --danger: #f07178;
    --radius: 10px; --radius-sm: 6px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; background: var(--bg); color: var(--text);
    font-family: "DM Sans", system-ui, -apple-system, sans-serif; line-height: 1.5;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--bg-panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 2rem 1.75rem;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
  }
  .brand { display: flex; align-items: center; gap: .65rem; margin-bottom: 1.5rem; }
  .brand svg { color: var(--primary); flex: none; }
  .brand-title { font-weight: 700; font-size: 1.05rem; letter-spacing: -.02em; line-height: 1.15; }
  .brand-sub {
    font-size: .68rem; color: var(--text-muted); font-weight: 500;
    letter-spacing: .02em; text-transform: uppercase;
  }
  h1 { margin: 0 0 .35rem; font-size: 1.2rem; font-weight: 650; letter-spacing: -.02em; }
  .hint { margin: 0 0 1.35rem; color: var(--text-muted); font-size: .875rem; }
  label { display: block; margin-bottom: .9rem; }
  label span {
    display: block; margin-bottom: .35rem; font-weight: 600; font-size: .72rem;
    letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted);
  }
  input {
    width: 100%; padding: .6rem .75rem; font: inherit; color: var(--text);
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius-sm); transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59,158,255,.35);
  }
  button {
    width: 100%; margin-top: .35rem; padding: .65rem 1rem; font: inherit; font-weight: 600;
    color: #fff; background: var(--primary); border: 1px solid var(--primary);
    border-radius: var(--radius-sm); cursor: pointer; transition: background .15s;
  }
  button:hover:not(:disabled) { background: var(--primary-hover); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .error {
    margin: 0 0 1rem; padding: .6rem .75rem; font-size: .85rem; color: var(--danger);
    background: rgba(240,113,120,.14); border: 1px solid rgba(240,113,120,.35);
    border-radius: var(--radius-sm);
  }
  .error[hidden] { display: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true">
        <path d="M16 3L4 9v6c0 7.2 5.1 13.9 12 15.5C22.9 28.9 28 22.2 28 15V9L16 3z" stroke="currentColor" stroke-width="1.8"/>
        <path d="M16 10v12M12 16h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>
        <span class="brand-title">AtraOps</span><br />
        <span class="brand-sub">Asset Management System</span>
      </span>
    </div>

    <h1>Sign in</h1>
    <p class="hint">Accounts are created by an administrator.</p>

    <p class="error" id="error" hidden></p>

    <form id="form" novalidate>
      <label>
        <span>Email</span>
        <input type="email" name="email" autocomplete="username" required autofocus />
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" id="submit">Sign in</button>
    </form>
  </main>

<script>
  var form = document.getElementById("form");
  var errorBox = document.getElementById("error");
  var submit = document.getElementById("submit");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.hidden = false;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorBox.hidden = true;
    submit.disabled = true;
    submit.textContent = "Signing in…";

    var body = {
      email: form.elements.email.value,
      password: form.elements.password.value
    };

    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (r) {
        return r.json().then(function (data) { return { ok: r.ok, data: data }; });
      })
      .then(function (res) {
        if (res.ok) { window.location.href = "/"; return; }
        showError(res.data.error || "Sign in failed.");
        submit.disabled = false;
        submit.textContent = "Sign in";
      })
      .catch(function () {
        showError("Could not reach the server. Try again.");
        submit.disabled = false;
        submit.textContent = "Sign in";
      });
  });
</script>
</body>
</html>
