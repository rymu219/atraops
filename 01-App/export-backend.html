<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOL PUS — Backend Export Helper</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    code { background: #f0f0f0; padding: 0.1em 0.35em; border-radius: 4px; }
    button { padding: 0.6rem 1rem; font-weight: 600; cursor: pointer; margin: 0.25rem 0.25rem 0.25rem 0; }
    .note { color: #555; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>LOL PUS Backend Export Helper</h1>
  <p class="note">
    Open this file from the <strong>same folder</strong> as <code>index.html</code> (same browser origin)
    so it can read the data saved by LOL PUS. Prefer using <strong>Admin → Export Backend JSON</strong>
    inside the main app when possible.
  </p>
  <button type="button" id="btn">Download Backend JSON</button>
  <p id="status" class="note"></p>
  <script>
    var KEYS = [
      "fieldops-theme",
      "fieldops-master-categories",
      "fieldops-connection-types",
      "fieldops-locations",
      "fieldops-descriptions",
      "fieldops-assets",
      "fieldops-asset-docs",
      "fieldops-rack-bin"
    ];
    document.getElementById("btn").onclick = function () {
      var data = {};
      KEYS.forEach(function (k) {
        try {
          var raw = localStorage.getItem(k);
          data[k] = raw == null ? null : JSON.parse(raw);
        } catch (e) {
          data[k] = localStorage.getItem(k);
        }
      });
      var pkg = {
        app: "LOL PUS",
        version: 1,
        exportedAt: new Date().toISOString(),
        keys: KEYS.slice(),
        data: data
      };
      var blob = new Blob([JSON.stringify(pkg, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "LOL-PUS-backend-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".json";
      a.click();
      document.getElementById("status").textContent = "Download started. Copy this JSON with the AtraOps-Export folder to the new PC.";
    };
  </script>
</body>
</html>
